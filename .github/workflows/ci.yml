name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    # amd64 only: the box is generic-x86-64 and the pjproject build the add-on
    # relies on is validated for that arch alone.
    runs-on: ubuntu-latest
    steps:
      # urmet-sdk is a published PyPI dependency, so there is nothing to check out
      # beside this repository: `make build` pip-installs it into the gateway venv.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: card/package-lock.json

      - name: Provision the three areas (venvs and card deps)
        run: make build

      - name: Unified gate (gateway + integration + card)
        run: make check
