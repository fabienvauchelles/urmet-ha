# Action definitions for the Urmet doorphone (DESIGN 6.5). Names and
# descriptions live in strings.json / translations; this file declares the
# target, the fields and their selectors for the UI.
#
# Every action carries the same optional target: which doorphone it is aimed at.
# With one panel set up it may be left out. With several, an action that names
# none is refused rather than guessing.

answer:
  target:
    device:
      integration: urmet
  fields:
    call_id:
      required: false
      example: "a1b2c3"
      selector:
        text:

hang_up:
  target:
    device:
      integration: urmet
  fields:
    call_id:
      required: false
      example: "a1b2c3"
      selector:
        text:

look:
  target:
    device:
      integration: urmet
  fields:
    want_video:
      required: false
      default: true
      selector:
        boolean:

open:
  target:
    device:
      integration: urmet
  fields:
    actuator:
      required: true
      selector:
        select:
          translation_key: actuator
          options:
            - door
            - gate

set_microphone:
  target:
    device:
      integration: urmet
  fields:
    muted:
      required: true
      selector:
        boolean:
