[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "urmet-gateway"
version = "0.1.0"
description = "Terminates the Urmet SIP leg and originates a WebRTC leg for Home Assistant."
requires-python = ">=3.12"
license = "LicenseRef-FSL-1.1-MIT"
authors = [{ name = "Fabien Vauchelles" }]

# urmet-sdk is published on PyPI and pinned so the add-on image is reproducible.
# pjsua2 is still built from source in the Dockerfile (it is not on PyPI); the SDK
# itself is a pure-Python wheel and installs from PyPI like the rest.
dependencies = [
    "aiohttp>=3.9",
    "aiortc>=1.9",
    "av>=12",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "urmet-sdk==0.1.0",
]

[tool.setuptools.packages.find]
include = ["urmet_gateway*"]
exclude = ["vendor*", "tests*"]
