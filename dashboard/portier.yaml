# Portier Urmet dashboard, ready to import in one step.
#
# In Home Assistant: Settings > Dashboards > Add dashboard > New dashboard from
# scratch. Open it, then the pencil (Edit) > the three-dot menu > Raw
# configuration editor, and paste everything below (replacing what is there).
#
# The card carries the whole surface: the ring banner, the live picture and sound
# once someone answers or looks, the door and gate openers, the talk button and a
# technical panel. It resolves the doorphone through the integration, so it does
# not depend on how your entities are named. It needs no camera entity of its own.
# If a separate camera points at your door, set preview_camera to show its image
# while the card is idle; otherwise leave it out.
title: Portier
views:
  - title: Portier
    path: portier
    icon: mdi:doorbell-video
    cards:
      - type: custom:urmet-portier-card
        auto_start: on_ring
        # preview_camera: camera.your_door_camera
